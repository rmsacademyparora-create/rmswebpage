<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMS Academy | Student Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand"><span class="logo">R</span><div><h1>RMS Academy</h1><p>Student Portal</p></div></div>
      <div id="status" class="status" aria-live="polite"></div>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
        <button type="submit">Login</button>
      </form>
      <section id="dashboard" class="dashboard hidden">
        <h2>Welcome! 🎉</h2>
        <p>You are logged in as <strong id="userName"></strong>.</p>
        <div class="info"><span>Role</span><strong id="userRole">-</strong></div>
        <div class="info"><span>API Status</span><strong id="apiStatus">Connected</strong></div>
        <button id="logout" class="secondary">Logout</button>
      </section>
      <p class="demo">Demo account: <b>admin</b> / <b>admin123</b></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
