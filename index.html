<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMS Academy - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand">
        <div class="logo">R</div>
        <div>
          <h1 id="login-title">RMS Academy</h1>
          <p>Student Portal</p>
        </div>
      </div>

      <form id="loginForm" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required />

        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
          <button type="button" id="togglePassword" class="toggle-btn" aria-label="Show password">Show</button>
        </div>

        <p id="message" class="message" role="alert"></p>
        <button class="login-btn" type="submit">Login</button>
      </form>

      <div id="dashboard" class="dashboard hidden">
        <h2>Login successful 🎉</h2>
        <p>Welcome, <strong id="loggedInUser"></strong>!</p>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>

      <p class="demo-note">Demo login: <strong>admin</strong> / <strong>admin123</strong></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
